<!DOCTYPE html>
<html lang="sr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Košarkaška Liga - Fizičko</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#fff7ed', 500: '#f97316', 600: '#ea580c', 700: '#c2410c' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK (v9 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans transition-colors duration-300">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-brand-500 text-white p-2.5 rounded-xl shadow-md text-xl font-black">
                    <i class="fa-solid fa-basketball"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold tracking-wider uppercase text-white">Košarkaška Liga <span class="text-brand-500">Fizičko</span></h1>
                    <p class="text-xs text-slate-400">Povezano uživo preko Firebase-a</p>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <div id="adminBadge" class="hidden items-center bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 px-3 py-1.5 rounded-lg text-xs font-bold">
                    <i class="fa-solid fa-shield-halved mr-1.5"></i> ADMIN AKTIVAN
                </div>
                <button onclick="toggleAdminModal()" id="adminBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-xl text-sm font-semibold border border-slate-700 transition flex items-center shadow">
                    <i class="fa-solid fa-lock mr-2 text-brand-500" id="adminIcon"></i> <span id="adminBtnText">Admin Prijava</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8 space-y-10">

        <!-- Standings Table -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl shadow-xl overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
                <h2 class="text-lg font-bold flex items-center text-white">
                    <i class="fa-solid fa-trophy text-amber-400 mr-2"></i> Tabela Lige
                </h2>
                <span class="text-xs text-slate-400">POB=2, POR=1</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-800 text-slate-400 text-xs uppercase tracking-wider bg-slate-950/50">
                            <th class="py-3 px-4 font-semibold text-center w-12">#</th>
                            <th class="py-3 px-4 font-semibold">Tim</th>
                            <th class="py-3 px-4 font-semibold text-center">U</th>
                            <th class="py-3 px-4 font-semibold text-center">P</th>
                            <th class="py-3 px-4 font-semibold text-center">I</th>
                            <th class="py-3 px-4 font-semibold text-center">+ / -</th>
                            <th class="py-3 px-4 font-semibold text-center">Bod</th>
                            <th class="py-3 px-4 font-semibold text-center admin-only hidden">Akcija</th>
                        </tr>
                    </thead>
                    <tbody id="standingsBody" class="divide-y divide-slate-800/60 text-sm"></tbody>
                </table>
            </div>
        </section>

        <!-- Teams and Players Grid -->
        <section class="space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-black text-white flex items-center">
                    <i class="fa-solid fa-users text-brand-500 mr-2"></i> Timovi i Igrači
                </h2>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6" id="teamsContainer"></div>
        </section>

    </main>

    <!-- Admin Modal -->
    <div id="adminModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-6">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-white flex items-center">
                    <i class="fa-solid fa-key text-brand-500 mr-2"></i> Admin Prijava
                </h3>
                <button onclick="toggleAdminModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Unesi Admin PIN (Podrazumevano: 1234)</label>
                    <input type="password" id="pinInput" placeholder="Unesi PIN..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-500">
                </div>
                <div id="pinError" class="text-rose-400 text-xs hidden">Pogrešan PIN! Pokušaj ponovo.</div>
                <div class="flex space-x-3 pt-2">
                    <button onclick="checkAdminLogin()" class="flex-1 bg-brand-600 hover:bg-brand-500 text-white font-bold py-3 rounded-xl transition">Prijavi se</button>
                    <button onclick="toggleAdminModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-3 rounded-xl transition">Otkaži</button>
                </div>
            </div>
            <div id="adminSettingsSection" class="border-t border-slate-800 pt-4 hidden space-y-3">
                <button onclick="logoutAdmin()" class="w-full bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 py-2.5 rounded-xl text-sm font-bold transition">Odjavi se</button>
            </div>
        </div>
    </div>

    <!-- Edit Player Modal -->
    <div id="playerModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-5">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-white">Izmeni Igrača</h3>
                <button onclick="closePlayerModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <input type="hidden" id="editPlayerTeamIndex">
            <input type="hidden" id="editPlayerIndex">
            <div class="space-y-4">
                <div>
                    <label class
